name: hydra-practice
services:
  migrate-source:
    image: oryd/hydra:v2.2.0
    environment:
      DSN: mysql://hydra:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:3306)/hydra?tls=true&parseTime=true
      SSL_CERT_FILE: /certs/global-bundle.pem
    volumes: [./runtime/certs:/certs:ro]
    command: [migrate, sql, -e, --yes]
  migrate-target:
    image: oryd/hydra:v2.2.0
    environment:
      DSN: postgres://hydra:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/hydra?sslmode=verify-full&sslrootcert=/certs/global-bundle.pem
    volumes: [./runtime/certs:/certs:ro]
    command: [migrate, sql, -e, --yes]
  source:
    image: oryd/hydra:v2.2.0
    command: [serve, all, --dev]
    environment: &hydra-env
      DSN: mysql://hydra:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:3306)/hydra?tls=true&parseTime=true
      SSL_CERT_FILE: /certs/global-bundle.pem
      URLS_SELF_ISSUER: http://localhost:8080
      URLS_LOGIN: http://localhost:8080/login
      URLS_CONSENT: http://localhost:8080/consent
      URLS_LOGOUT: http://localhost:8080/
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET}
      SECRETS_COOKIE: ${HYDRA_COOKIE_SECRET}
      OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES: public
      TTL_ACCESS_TOKEN: 24h
      TTL_REFRESH_TOKEN: 720h
    volumes: [./runtime/certs:/certs:ro]
    ports: ["127.0.0.1:4445:4445"]
    depends_on:
      migrate-source: {condition: service_completed_successfully}
  target:
    image: oryd/hydra:v2.2.0
    profiles: [target]
    command: [serve, all, --dev]
    environment:
      <<: *hydra-env
      DSN: postgres://hydra:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/hydra?sslmode=verify-full&sslrootcert=/certs/global-bundle.pem
    volumes: [./runtime/certs:/certs:ro]
    ports: ["127.0.0.1:5445:4445"]
    depends_on:
      migrate-target: {condition: service_completed_successfully}
  portal:
    build: ./app
    environment:
      ISSUER: http://localhost:8080
      INTERNAL_ISSUER: http://gateway:8080
      PORTAL_URL: http://localhost:8080
      CLIENT_SECRET: ${PORTAL_CLIENT_SECRET}
    volumes: [./runtime:/runtime]
  gateway:
    image: nginx:1.27.4-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runtime/upstream.conf:/etc/nginx/hydra-upstream.conf:ro
    depends_on: [source, portal]
