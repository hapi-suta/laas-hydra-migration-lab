name: hydra-practice
services:
  mysql:
    image: mysql:8.0.41
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/lab.py init}
      MYSQL_DATABASE: hydra
      MYSQL_USER: hydra
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/lab.py init}
    command: [--server-id=1, --log-bin=mysql-bin, --binlog-format=ROW, --binlog-row-image=FULL, --binlog-expire-logs-seconds=259200]
    ports: ["127.0.0.1:13306:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      timeout: 5s
      retries: 60
  postgres:
    image: postgres:17.4
    environment:
      POSTGRES_DB: hydra
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/lab.py init}
    ports: ["127.0.0.1:15432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hydra -d hydra]
      interval: 5s
      timeout: 5s
      retries: 60
  migrate-source:
    image: oryd/hydra:v2.2.0
    environment:
      DSN: mysql://hydra:${MYSQL_PASSWORD}@tcp(mysql:3306)/hydra?parseTime=true&max_conns=20
    command: [migrate, sql, -e, --yes]
    depends_on:
      mysql: {condition: service_healthy}
  migrate-target:
    image: oryd/hydra:v2.2.0
    environment:
      DSN: postgres://hydra:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
    command: [migrate, sql, -e, --yes]
    depends_on:
      postgres: {condition: service_healthy}
  source:
    image: oryd/hydra:v2.2.0
    command: [serve, all, --dev]
    environment: &hydra-env
      DSN: mysql://hydra:${MYSQL_PASSWORD}@tcp(mysql:3306)/hydra?parseTime=true&max_conns=20
      URLS_SELF_ISSUER: http://localhost:8080
      URLS_LOGIN: http://localhost:8080/login
      URLS_CONSENT: http://localhost:8080/consent
      URLS_LOGOUT: http://localhost:8080/
      SECRETS_SYSTEM: ${HYDRA_SYSTEM_SECRET}
      SECRETS_COOKIE: ${HYDRA_COOKIE_SECRET}
      OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES: public
      TTL_ACCESS_TOKEN: 24h
      TTL_REFRESH_TOKEN: 720h
    ports: ["127.0.0.1:4445:4445"]
    depends_on:
      migrate-source: {condition: service_completed_successfully}
  target:
    image: oryd/hydra:v2.2.0
    profiles: [target]
    command: [serve, all, --dev]
    environment:
      <<: *hydra-env
      DSN: postgres://hydra:${POSTGRES_PASSWORD}@postgres:5432/hydra?sslmode=disable
    ports: ["127.0.0.1:5445:4445"]
    depends_on:
      migrate-target: {condition: service_completed_successfully}
  portal:
    build: ./app
    environment:
      ISSUER: http://localhost:8080
      INTERNAL_ISSUER: http://gateway:8080
      PORTAL_URL: http://localhost:8080
      CLIENT_SECRET: ${PORTAL_CLIENT_SECRET}
    volumes: [./runtime:/runtime]
  gateway:
    image: nginx:1.27.4-alpine
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runtime/upstream.conf:/etc/nginx/hydra-upstream.conf:ro
    depends_on: [source, portal]
volumes:
  mysql-data:
  postgres-data:
